plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.cyberspectraa.cyberserver'

base {
    archivesName = 'cyberserver'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

sourceSets {
    main {
        java.setSrcDirs(['cyberserver/src/main/java'])
        resources.setSrcDirs(['cyberserver/src/main/resources'])
    }
    fxgen {
        java.setSrcDirs(['fxgen/src/main/java'])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content { includeGroup "com.lowdragmc.ldlib" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    // Build-time only. These never get bundled into CyberServer.jar.
    fxgenImplementation fg.deobf("curse.maven:photon-871522:7501597@jar")
    fxgenImplementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42@jar")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CyberServer-0.1.0-forge-1.20.1.jar"

    manifest {
        attributes([
                'Specification-Title'     : 'cyberserver',
                'Specification-Vendor'    : 'Cyberspectraa',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'CyberServer',
                'Implementation-Version'  : '0.1.0',
                'Implementation-Vendor'   : 'Cyberspectraa',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('generatePhotonFx', JavaExec) {
    dependsOn tasks.named('fxgenClasses')
    classpath = sourceSets.fxgen.runtimeClasspath
    mainClass = 'com.cyberspectraa.cyberserver.fxgen.SummoningFxGenerator'
    args layout.buildDirectory.file('generated-cyberserver-pack/assets/cyberserver/fx/summoning.fx').get().asFile.absolutePath
}

tasks.register('buildCyberServerResourcePack', Zip) {
    dependsOn tasks.named('generatePhotonFx')
    archiveFileName = 'CyberServer-Resources-0.1.0.zip'
    destinationDirectory = layout.buildDirectory.dir('resourcepack')
    from('cyberserver-resourcepack')
    from(layout.buildDirectory.dir('generated-cyberserver-pack'))
}

tasks.named('build').configure {
    dependsOn tasks.named('buildCyberServerResourcePack')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

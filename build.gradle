plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cyberserver'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

sourceSets {
    main {
        java.setSrcDirs(['cyberserver/src/main/java'])
        resources.setSrcDirs(['cyberserver/src/main/resources'])
    }
    fxgen {
        java.setSrcDirs(['fxgen/src/main/java'])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.maxhenkel.de/repository/public" }
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content { includeGroup "com.lowdragmc.ldlib" }
    }
}

configurations { embeddedSpeech }
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.0"
    implementation "com.alphacephei:vosk:0.3.45"
    embeddedSpeech "com.alphacephei:vosk:0.3.45"

    // Build-time only. These never get bundled into CyberServer.jar.
    fxgenImplementation fg.deobf("curse.maven:photon-871522:7501597@jar")
    fxgenImplementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42@jar")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('bundleEnglishVoiceModel') {
    def modelFile = layout.buildDirectory.file('generated-vosk-model/vosk-model-small-en-us-0.15.zip')
    outputs.file(modelFile)
    doLast {
        def dest = modelFile.get().asFile
        dest.parentFile.mkdirs()
        def connection = new URL('https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip').openConnection()
        connection.setConnectTimeout(30000)
        connection.setReadTimeout(120000)
        def tmp = new File(dest.parentFile, dest.name + '.tmp')
        connection.getInputStream().withCloseable { input ->
            tmp.withOutputStream { output -> output << input }
        }
        if (tmp.length() < 1_000_000L || tmp.length() > 75_000_000L) {
            tmp.delete()
            throw new GradleException('English Vosk model outside expected size')
        }
        def zip = new java.util.zip.ZipFile(tmp)
        try {
            if (!zip.entries().toList().any { it.name.contains('am/final.mdl') }) {
                throw new GradleException('English model archive missing required model file')
            }
        } finally { zip.close() }
        java.nio.file.Files.move(tmp.toPath(), dest.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('bundleEnglishVoiceModel')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('generated-vosk-model')) { into 'assets/cyberserver/voice' }
    from({ configurations.embeddedSpeech.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST'
    }

    archiveFileName = "CyberServer-${mod_version}-forge-${minecraft_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : 'cyberserver',
                'Specification-Vendor'    : 'Cyberspectraa',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'CyberServer',
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'Cyberspectraa',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('generatePhotonFx', JavaExec) {
    dependsOn tasks.named('fxgenClasses')
    classpath = sourceSets.fxgen.runtimeClasspath
    mainClass = 'com.cyberspectraa.cyberserver.fxgen.SummoningFxGenerator'
    args layout.buildDirectory.file('generated-cyberserver-pack/assets/cyberserver/fx/summoning.fx').get().asFile.absolutePath
}

tasks.register('buildCyberServerResourcePack', Zip) {
    dependsOn tasks.named('generatePhotonFx')
    archiveFileName = "CyberServer-Resources-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepack')
    from('cyberserver-resourcepack')
    from(layout.buildDirectory.dir('generated-cyberserver-pack'))
}

tasks.named('build').configure {
    dependsOn tasks.named('buildCyberServerResourcePack')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

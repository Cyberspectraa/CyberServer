name: Build CyberServer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload CyberServer test package
        uses: actions/upload-artifact@v4
        with:
          name: CyberServer-0.1.0-test
          path: |
            build/libs/CyberServer-0.1.0-forge-1.20.1.jar
            build/resourcepack/CyberServer-Resources-0.1.0.zip
          if-no-files-found: error
